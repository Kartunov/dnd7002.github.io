<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon-blue.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты Кадгара</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            /* Темно-синий фон с текстурой */
            background-color: #0f1722; 
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c9d6e8;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 40px;
        }

        /* Общие стили для карточек */
        .card {
            display: flex;
            flex-direction: column;
            padding: 25px 30px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .card h2 {
            margin-top: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card p {
            margin-bottom: 0;
            font-size: 1.05em;
        }

        /* Желтая карточка (кликабельная) */
        .card-yellow {
            background-color: rgba(42, 42, 42, 0.95);
            border: 1px solid #444;
            border-left: 5px solid #c9a227;
            text-decoration: none;
            color: #e8e0d0;
            cursor: pointer;
        }

        .card-yellow:hover {
            background-color: rgba(51, 51, 51, 1);
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(201, 162, 39, 0.2);
            border-color: #c9a227;
        }

        .card-yellow h2 {
            color: #c9a227;
        }

       /* Синяя карточка (кликабельная) */
        .card-blue-clickable {
            background-color: rgba(27, 40, 56, 0.95);
            border: 1px solid #333;
            border-left: 5px solid #4a90e2; /* Ярко-синяя полоса */
            text-decoration: none;
            color: #c9d6e8;
            cursor: pointer;
        }

        .card-blue-clickable:hover {
            background-color: rgba(35, 51, 71, 1);
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(74, 144, 226, 0.2);
            border-color: #4a90e2;
        }

        .card-blue-clickable h2 {
            color: #4a90e2; /* Ярко-синий заголовок */
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1>💙 Инструменты Кадгара</h1>

        <!-- Желтая карточка возврата -->
        <a href="index.html" class="card card-yellow">
            <h2>Инструменты мастера</h2>
            <p>Иди на свет, твоей цели нет в этом подземелье, тебя ждут настоящие приключения</p>
        </a>
        
         <!-- Синяя карточка-ссылка (НОВАЯ) -->
        <a href="d6.html" class="card card-blue-clickable">
            <h2>Первый уровень</h2>
            <p>От 1 до 6 дополнительных комнат на этаж</p>
        </a>
    </div>
</body>
</html>
