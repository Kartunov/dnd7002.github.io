<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon-blue.png"> <!-- Новая иконка -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты Кадгара</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            background-color: #0f1722; /* Более темный, синеватый фон */
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c9d6e8;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #4a90e2; /* Синий акцент */
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover { color: #fff; }

        /* Карточка возврата */
        .return-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: rgba(27, 40, 56, 0.95);
            border: 1px solid #4a90e2;
            border-left: 5px solid #4a90e2;
            padding: 20px;
            border-radius: 4px;
            text-decoration: none;
            color: #c9d6e8;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            text-align: center;
        }
        .return-card:hover {
            background-color: rgba(34, 50, 70, 1);
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(74, 144, 226, 0.3);
        }
        .return-card h2 {
            color: #4a90e2;
            margin: 0;
            font-family: 'Cinzel', serif;
        }

        .placeholder {
            background-color: rgba(27, 40, 56, 0.8);
            border-left: 5px solid #4a90e2;
            padding: 20px;
            border-radius: 4px;
            color: #a0b4cc;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>💙 Инструменты Кадгара</h1>
    
    <p style="text-align: center; margin-bottom: 30px;">
        <a href="index.html" class="return-card">
            <h2>← Вернуться к Инструментам Мастера</h2>
        </a>
    </p>

    <div class="placeholder">
        <p>Страница в разработке. Здесь скоро появятся «настоящие подземелья».</p>
    </div>
</body>
</html>
