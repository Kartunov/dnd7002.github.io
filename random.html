    <title>Всякие случайности — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
        }
        h2 {
            color: #c9a227;
        }
        a {
            color: #e8b84b;
        }
        
        .card {
            background-color: #2a2a2a;
            border-left: 4px solid #c9a227;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .btn {
            background-color: #c9a227;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e8b84b;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .results-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 4px;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .result-item strong {
            color: #e8b84b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        const resultsContainer = document.getElementById('weapon-results');
        let itemCounter = 0; // Счетчик для уникальных ID (если понадобятся)

        // Функция для генерации случайного эффекта
        function rollWeaponEffect() {
            // 1. Выбираем случайный эффект
            const randomIndex = Math.floor(Math.random() * weaponEffects.length);
            const effectText = weaponEffects[randomIndex];

            // 2. Разделяем на Название и Описание (по первому двоеточию)
            let title = "Эффект";
            let description = effectText;
            
            const colonIndex = effectText.indexOf(':');
            if (colonIndex !== -1) {
                title = effectText.substring(0, colonIndex).trim();
                description = effectText.substring(colonIndex + 1).trim();
            }

            // 3. Создаем HTML-элемент для нового результата
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerHTML = `<strong>${title}:</strong> ${description}`;

            // 4. Добавляем его в начало контейнера
            resultsContainer.prepend(resultDiv);

            // 5. Проверяем, не стало ли элементов больше 3
            if (resultsContainer.children.length > 3) {
                // Удаляем самый последний (нижний) элемент
                resultsContainer.lastElementChild.remove();
            }
        }

        // Вешаем обработчик клика на кнопку
        btn.addEventListener('click', rollWeaponEffect);
    </script>

        const runeBtn = document.getElementById('roll-rune-btn');
        const runeResultsContainer = document.getElementById('rune-results');

        // Функция для генерации случайной руны
        function rollWeaponRune() {
            // 1. Выбираем случайную руну
            const randomIndex = Math.floor(Math.random() * weaponRunes.length);
            const runeText = weaponRunes[randomIndex];

            // 2. Разделяем на Название и Описание (по первому двоеточию)
            let title = "Руна";
            let description = runeText;
            
            const colonIndex = runeText.indexOf(':');
            if (colonIndex !== -1) {
                title = runeText.substring(0, colonIndex).trim();
                description = runeText.substring(colonIndex + 1).trim();
            }

            // 3. Создаем HTML-элемент для нового результата
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerHTML = `<strong>${title}:</strong> ${description}`;

            // 4. Добавляем его в начало контейнера
            runeResultsContainer.prepend(resultDiv);

            // 5. Проверяем, не стало ли элементов больше 3
            if (runeResultsContainer.children.length > 3) {
                // Удаляем самый последний (нижний) элемент
                runeResultsContainer.lastElementChild.remove();
            }
        }

        // Вешаем обработчик клика на кнопку рун
        runeBtn.addEventListener('click', rollWeaponRune);
    </script>

        const potionBtn = document.getElementById('roll-potion-btn');
        const potionResultsContainer = document.getElementById('potion-results');

        // Функция для генерации эффекта зелья
        function rollPotionEffect() {
            // 1. Выбираем случайный эффект
            const randomIndex = Math.floor(Math.random() * potionEffects.length);
            const effectText = potionEffects[randomIndex];

            // 2. Создаем HTML-элемент для нового результата
            // (у зелий нет названий через двоеточие, поэтому выводим просто текст)
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerHTML = effectText;

            // 3. Добавляем его в начало контейнера
            potionResultsContainer.prepend(resultDiv);

            // 4. Проверяем, не стало ли элементов больше 3
            if (potionResultsContainer.children.length > 3) {
                // Удаляем самый последний (нижний) элемент
                potionResultsContainer.lastElementChild.remove();
            }
        }

        // Вешаем обработчик клика на кнопку зелий
        potionBtn.addEventListener('click', rollPotionEffect);
    </script>

        // Получаем элементы для блока чёрного рынка
        const marketBtn = document.getElementById('roll-market-btn');
        const marketResultsContainer = document.getElementById('market-results');

        // Функция для генерации предмета с чёрного рынка
        function rollMarketItem() {
            // 1. Выбираем случайный предмет
            const randomIndex = Math.floor(Math.random() * marketItems.length);
            const itemText = marketItems[randomIndex];

            // 2. Создаем HTML-элемент для нового результата
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerHTML = itemText;

            // 3. Добавляем его в начало контейнера
            marketResultsContainer.prepend(resultDiv);

            // 4. Проверяем, не стало ли элементов больше 3
            if (marketResultsContainer.children.length > 3) {
                // Удаляем самый последний (нижний) элемент
                marketResultsContainer.lastElementChild.remove();
            }
        }

        // Вешаем обработчик клика на кнопку
        marketBtn.addEventListener('click', rollMarketItem);
