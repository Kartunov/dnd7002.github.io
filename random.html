<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Всякие случайности — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
        }
        h2 {
            color: #c9a227;
        }
        a {
            color: #e8b84b;
        }
        
        .card {
            background-color: #2a2a2a;
            border-left: 4px solid #c9a227;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .btn {
            background-color: #c9a227;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e8b84b;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .results-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 4px;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .result-item strong {
            color: #e8b84b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <p><a href="index.html">← Назад на главную</a></p>
