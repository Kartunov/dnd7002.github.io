<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша D&D кампания</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
        }
        h2 {

        }
        a {
            color: #e8b84b;
        }
        .card {
            background-color: #2a2a2a;
            border-left: 4px solid #c9a227;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>

<body>
    <h1>⚔️ Наша D&D кампания</h1>
    <p>Добро пожаловать на сайт нашего приключения!</p>

    <div class="card">
        <h2>О кампании</h2>
        <p>Здесь будет описание мира, лор и основные события.</p>
    </div>

    <div class="card">
        <h2>Персонажи</h2>
        <p>Ссылки на листы персонажей и их истории появятся здесь.</p>
    </div>

    <div class="card">
        <h2>Правила и заметки</h2>
        <p>Домашние правила, полезные ссылки и записи сессий.</p>
    </div>

</html>
