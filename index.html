<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты мастера — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
        }
        a {
            color: #e8b84b;
        }
        .card {
            display: block;
            background-color: #2a2a2a;
            border-left: 4px solid #c9a227;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
            text-decoration: none;
            color: #e8e0d0;
            transition: background-color 0.2s, transform 0.2s;
        }
        .card:hover {
            background-color: #333333;
            transform: translateX(4px);
        }
        .card h2 {
            color: #c9a227;
            margin-top: 0;
        }
        .card p {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>⚔️ Инструменты мастера</h1>
    <p>Набор генераторов и помощников для нашей D&D кампании.</p>

    <!-- Карточка-ссылка. Чтобы добавить новый блок — скопируй этот <a> и поменяй заголовок, описание и href -->
    <a class="card" href="monster.html">
        <h2>Создатель монстров</h2>
        <p>Небольшой генератор упрощённого статблока монстра по собирательным таблицам.</p>
    </a>

</body>
</html>
