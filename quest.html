<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска с заданиями — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
            text-align: center;
        }
        a { color: #e8b84b; }

        .controls {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #c9a227;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .controls label {
            font-size: 1.1em;
            color: #c9a227;
        }
        select {
            background-color: #1a1a1a;
            color: #e8e0d0;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1.1em;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #c9a227; }

        /* Таблица */
        .table-container {
            display: none; /* Скрыто, пока нет выбора */
        }
        .table-container.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            font-size: 1em;
        }
        th, td {
            border: 1px solid #555;
            padding: 15px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #333;
            color: #c9a227;
            font-weight: normal;
            text-align: center;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        td {
            font-size: 1.05em;
        }
        /* Подсветка пустых полей "Ничего" */
        .empty-text {
            color: #666;
            font-style: italic;
        }
        .highlight {
            color: #e8b84b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>📜 Доска с заданиями</h1>
    <p style="text-align: center;"><a href="index.html">← Назад на главную</a></p>

    <div class="controls">
        <label for="quest-count">Сколько заданий должно висеть на доске?</label>
        <select id="quest-count">
            <option value="0">— Выберите —</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

    <div class="table-container" id="table-container">
        <table>
            <thead>
                <tr>
                    <th>Задача</th>
                    <th>Уточнение</th>
                    <th>Особая награда</th>
                    <th>Неожиданный поворот</th>
                </tr>
            </thead>
            <tbody id="quest-table-body">
                <!-- Строки будут добавляться сюда -->
            </tbody>
        </table>
    </div>

    <script>
        // ==== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====
        
        // Функция для выбора случайного элемента из массива
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Функция для генерации "Особой награды" по заданным процентам
        function generateReward() {
            const roll = Math.random() * 100; // от 0 до 100
            
            if (roll < 60) {
                return { text: "Ничего", isEmpty: true };
            } else if (roll < 75) { // 60 + 15
                const item = getRandom(["зелья", "свитки", "бомбы", "масла"]);
                return { text: `Расходник (${item})`, isEmpty: false };
            } else if (roll < 90) { // 75 + 15
                const item = getRandom(["Оружие ближнего боя", "оружие дальнего боя", "доспехи"]);
                return { text: `Снаряжение (${item})`, isEmpty: false };
            } else if (roll < 95) { // 90 + 5
                const item = getRandom(["возможность", "информация", "услуга"]);
                return { text: `Анлок (${item})`, isEmpty: false };
            } else { // 95 + 5 = 100
                const item = getRandom(["артефакт", "безделушка"]);
                return { text: `Особое (${item})`, isEmpty: false };
            }
        }

        // Функция для генерации "Неожиданного поворота" по заданным процентам
        function generateTwist() {
            const roll = Math.random() * 100;
            
            if (roll < 80) {
                return { text: "Ничего", isEmpty: true };
            } else if (roll < 85) {
                return { text: "Опоздание", isEmpty: false };
            } else if (roll < 90) {
                return { text: "Вмешательство", isEmpty: false };
            } else if (roll < 95) {
                return { text: "Подмена", isEmpty: false };
            } else {
                return { text: "Болезнь или проклятие", isEmpty: false };
            }
        }

        // ==== ГЕНЕРАЦИЯ СТРОКИ ====
        
        function generateQuestRow() {
            // 1. Задача
            const task = getRandom(["Убийство", "Сопровождение", "Доставка", "Сбор", "Спасение", "Расследование"]);
            
            // 2. Уточнение (зависит от задачи)
            let detail = "";
            switch (task) {
                case "Убийство":
                    detail = getRandom(["НПС", "монстра"]);
                    break;
                case "Сопровождение":
                    detail = getRandom(["НПС", "отряда"]);
                    break;
                case "Доставка":
                    detail = getRandom(["вещь", "контрабанда"]);
                    break;
                case "Спасение":
                    detail = getRandom(["НПС", "локации"]);
                    break;
                case "Сбор":
                    detail = "ресурсов"; // Тут только один вариант
                    break;
                case "Расследование":
                    detail = getRandom(["информации", "местности"]);
                    break;
            }

            // 3. Особая награда
            const reward = generateReward();

            // 4. Неожиданный поворот
            const twist = generateTwist();

            // 5. Создаем HTML для строки
            const tr = document.createElement('tr');
            
            // Форматируем ячейки с учетом "пустоты"
            const taskClass = task ? 'highlight' : '';
            const rewardClass = reward.isEmpty ? 'empty-text' : 'highlight';
            const twistClass = twist.isEmpty ? 'empty-text' : 'highlight';

            tr.innerHTML = `
                <td class="${taskClass}">${task}</td>
                <td>${detail}</td>
                <td class="${rewardClass}">${reward.text}</td>
                <td class="${twistClass}">${twist.text}</td>
            `;
            
            return tr;
        }

        // ==== ОБРАБОТКА ВЫБОРА ====

        const selectElement = document.getElementById('quest-count');
        const tableContainer = document.getElementById('table-container');
        const tableBody = document.getElementById('quest-table-body');

        selectElement.addEventListener('change', (e) => {
            const count = parseInt(e.target.value);
            
            // Очищаем старые строки
            tableBody.innerHTML = '';

            if (count > 0) {
                // Показываем таблицу
                tableContainer.classList.add('active');
                
                // Генерируем нужное количество строк
                for (let i = 0; i < count; i++) {
                    tableBody.appendChild(generateQuestRow());
                }
            } else {
                // Скрываем таблицу, если выбрано "Выберите"
                tableContainer.classList.remove('active');
            }
        });
    </script>
</body>
</html>
