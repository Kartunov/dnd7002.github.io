    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 1200px; /* Шире, чтобы помещалось 4 колонки */
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1 {
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
            text-align: center;
        }
        a {
            color: #e8b84b;
        }

        .header-nav {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Сетка для рас (4 в ряд) */
        .races-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        @media (max-width: 1000px) {
            .races-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .races-grid { grid-template-columns: 1fr; }
        }

        /* Стили для таблички-карточки расы */
        .race-card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Заголовок с названием расы (некликабельный) */
        .race-title {
            background-color: #333;
            color: #c9a227;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #444;
            text-transform: uppercase;
            font-size: 1.1em;
        }

        /* Кнопки Мужское / Женское */
        .gender-buttons {
            display: flex;
            border-bottom: 1px solid #444;
        }
        .gender-btn {
            flex: 1;
            background-color: #222;
            color: #e8e0d0;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
            transition: background-color 0.2s;
            border-right: 1px solid #444;
        }
        .gender-btn:last-child {
            border-right: none;
        }
        .gender-btn:hover {
            background-color: #444;
        }
        .gender-btn:active {
            background-color: #c9a227;
            color: #1a1a1a;
        }

        /* Поля вывода имён */
        .name-output {
            padding: 15px 10px;
            text-align: center;
            font-size: 0.95em;
            min-height: 60px;
            word-wrap: break-word;
            color: #e8b84b;
            background-color: #1a1a1a;
        }
    </style>

        let currentFunnyNicknames = [];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Обработчик для обычных прозвищ
        document.getElementById('btn-nicknames').onclick = () => {
            currentNicknames.push(getRandomItem(nicknamesData));
            if (currentNicknames.length > 5) currentNicknames.shift(); // Оставляем только 5
            
            const output = document.getElementById('output-nicknames');
            output.textContent = currentNicknames.join(', ');
            output.style.color = '#e8e0d0'; // Меняем цвет, когда появляется текст
        };

        // Обработчик для смешных прозвищ
        document.getElementById('btn-funny-nicknames').onclick = () => {
            currentFunnyNicknames.push(getRandomItem(funnyNicknamesData));
            if (currentFunnyNicknames.length > 5) currentFunnyNicknames.shift(); // Оставляем только 5
            
            const output = document.getElementById('output-funny-nicknames');
            output.textContent = currentFunnyNicknames.join(', ');
            output.style.color = '#e8e0d0'; 
        };
    </script>
</body>
</html>
