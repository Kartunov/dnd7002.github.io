    <title>Генератор имён — D&D</title>
    <style>
        /* Подключаем шрифт для заголовков */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            /* Фон с текстурой */
            background-color: #1a1a1a;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #e8e0d0;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #c9a227;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
        }

        a {
            color: #e8b84b;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #fff;
        }

        .header-nav {
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Сетка для рас (4 в ряд) */
        .races-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        @media (max-width: 1000px) {
            .races-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .races-grid { grid-template-columns: 1fr; }
        }

        /* Стили для таблички-карточки расы */
        .race-card {
            background-color: rgba(42, 42, 42, 0.95);
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .race-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }

        /* Заголовок с названием расы (некликабельный) */
        .race-title {
            background-color: #333;
            color: #c9a227;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            text-align: center;
            padding: 12px 10px;
            border-bottom: 1px solid #444;
            text-transform: uppercase;
            font-size: 1.1em;
            letter-spacing: 1px;
        }

        /* Кнопки Мужское / Женское */
        .gender-buttons {
            display: flex;
            border-bottom: 1px solid #444;
        }
        .gender-btn {
            flex: 1;
            background-color: #222;
            color: #e8e0d0;
            border: none;
            padding: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
            transition: all 0.2s;
            border-right: 1px solid #444;
        }
        .gender-btn:last-child {
            border-right: none;
        }
        .gender-btn:hover {
            background-color: #444;
            color: #c9a227;
        }
        .gender-btn:active {
            background-color: #c9a227;
            color: #1a1a1a;
        }

        /* Поля вывода имён */
        .name-output {
            padding: 15px 10px;
            text-align: center;
            font-size: 0.95em;
            min-height: 70px; /* Чуть больше высота, чтобы не прыгало */
            word-wrap: break-word;
            color: #e8b84b;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ТАБЛИЦА ПРОЗВИЩ */
        .nicknames-card {
            margin-top: 40px;
            background-color: rgba(42, 42, 42, 0.95);
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        
        .nicknames-row {
            display: flex;
            border-bottom: 1px solid #444;
        }
        .nicknames-row:last-child {
            border-bottom: none;
        }
        
        .nickname-btn {
            flex: 1;
            background-color: #333;
            color: #c9a227;
            border: none;
            border-right: 1px solid #444;
            padding: 15px;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s;
        }
        .nickname-btn:hover {
            background-color: #444;
        }
        
        .nickname-output {
            flex: 2;
            padding: 15px;
            background-color: #1a1a1a;
            color: #e8e0d0;
            display: flex;
            align-items: center;
            font-size: 1em;
        }
    </style>
</head>

            if (!arr || arr.length === 0) return "";
            return arr[Math.floor(Math.random() * arr.length)];

            racesGrid.innerHTML = '';

                raceCard.appendChild(title);

                btnContainer.className = 'gender-buttons';

                maleBtn.className = 'gender-btn';
                maleBtn.textContent = 'Мужское';

                femaleBtn.className = 'gender-btn';
                femaleBtn.textContent = 'Женское';

                btnContainer.appendChild(femaleBtn);
                raceCard.appendChild(btnContainer);

                const outputDiv = document.createElement('div');
                outputDiv.className = 'name-output';
                raceCard.appendChild(outputDiv);

                let currentMaleNames = [];
                let currentFemaleNames = [];

                function updateOutput() {
                    let allNames = [];
                    if (currentMaleNames.length > 0) allNames.push(currentMaleNames.join(', '));
                    if (currentFemaleNames.length > 0) allNames.push(currentFemaleNames.join(', '));
                    outputDiv.textContent = allNames.join(' | '); 
                }

                maleBtn.onclick = () => {
                    const newName = getRandomElement(data.male);
                    currentMaleNames.push(newName);
                    if (currentMaleNames.length > 3) currentMaleNames.shift(); 
                    updateOutput();
                };

                femaleBtn.onclick = () => {
                    const newName = getRandomElement(data.female);
                    currentFemaleNames.push(newName);
                    if (currentFemaleNames.length > 3) currentFemaleNames.shift();

                };

            }

            "Рыцарь Пластикового Доспеха", "Укротитель Тапок", "Победитель Комариного Роя", 
            "Мастер Неловких Падений", "Сэр Вечно Опоздавший", "Барон Прокисшего Молока", "Герой Без Подвига"
        ];

        let currentNicknames = [];
        let currentFunnyNicknames = [];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        document.getElementById('btn-nicknames').onclick = () => {
            currentNicknames.push(getRandomItem(nicknamesData));
            if (currentNicknames.length > 5) currentNicknames.shift(); 
            
            const output = document.getElementById('output-nicknames');
            output.textContent = currentNicknames.join(', ');
        };

        document.getElementById('btn-funny-nicknames').onclick = () => {
            currentFunnyNicknames.push(getRandomItem(funnyNicknamesData));
            if (currentFunnyNicknames.length > 5) currentFunnyNicknames.shift(); 
            
            const output = document.getElementById('output-funny-nicknames');
            output.textContent = currentFunnyNicknames.join(', ');
        };
    </script>
