<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon-blue.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первый уровень — Генератор этажа</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            background-color: #0f1722; 
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c9d6e8;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 20px;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #7ab5f5;
            text-decoration: underline;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        /* Контейнер для генератора */
        .generator-container {
            background-color: rgba(27, 40, 56, 0.8);
            border: 1px solid #333;
            border-left: 5px solid #2c5a8c;
            padding: 25px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px; 
        }

        /* Кнопка */
        .btn-generate {
            background-color: #4a90e2;
            color: #0f1722;
            border: none;
            padding: 12px 25px;
            font-size: 1.2em;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-generate:hover {
            background-color: #7ab5f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* Сетка 15x15 */
        .grid-container {
            display: none; 
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 4px; 
            background-color: #0a0f16;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .grid-container.active {
            display: grid;
        }

        /* Ячейка */
        .cell {
            width: 30px;
            height: 30px;
            background-color: #333; 
            border-radius: 4px;
            transition: all 0.2s;
            position: relative; /* Важно для позиционирования смайликов */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px; /* Размер смайлика */
            user-select: none; /* Запрет выделения текста */
        }

        /* Комната */
        .cell.room {
            background-color: #5a636e; 
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .cell.room:hover {
            background-color: #7a8491;
        }

        /* Панель с инструментами (флажки) */
        .tool-panel {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            padding: 15px 25px;
            background-color: rgba(15, 23, 34, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
        }

        .tool-item {
            font-size: 35px; /* Размер иконки в меню */
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.2s;
            opacity: 0.7;
            background-color: transparent;
        }

        .tool-item:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .tool-item.selected {
            opacity: 1;
            background-color: rgba(74, 144, 226, 0.3);
            box-shadow: 0 0 10px #4a90e2;
            transform: scale(1.1);
        }

        /* Подсказки */
        .info-text {
            margin-top: 15px;
            font-size: 0.9em;
            color: #8c9eb5;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <h1>🎲 Первый уровень</h1>
    <a href="kadgar.html" class="nav-link">← Назад в Инструменты Кадгара</a>

    <div class="generator-container">
        <button class="btn-generate" id="generate-btn">Создать этаж</button>
        
        <!-- Сетка -->
        <div class="grid-container" id="grid"></div>
        
        <!-- Панель с инструментами -->
        <div class="tool-panel" id="tool-panel" style="display: none;">
            <div class="tool-item" data-tool="start" title="Старт">🚩</div>
            <div class="tool-item" data-tool="finish" title="Финиш">🏁</div>
        </div>

        <div class="info-text" id="info"></div>
    </div>

    <script>
        // ==== НАСТРОЙКИ ГЕНЕРАЦИИ ====
        const GRID_SIZE = 15;
        
        const gridContainer = document.getElementById('grid');
        const generateBtn = document.getElementById('generate-btn');
        const infoText = document.getElementById('info');
        const toolPanel = document.getElementById('tool-panel');

        // Переменные для работы с инструментами
        let activeTool = null; // Какой флажок сейчас выбран
        let startPos = null;   // Координаты старта {x, y}
        let finishPos = null;  // Координаты финиша {x, y}

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function isValid(x, y) {
            return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE;
        }

        function countNeighbors(x, y, roomsSet) {
            let count = 0;
            const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            for (let [dx, dy] of dirs) {
                if (roomsSet.has(`${x + dx},${y + dy}`)) {
                    count++;
                }
            }
            return count;
        }

        // ==== ГЕНЕРАЦИЯ ====
        function generateDungeon() {
            // Сбрасываем флажки при новой генерации
            startPos = null;
            finishPos = null;
            activeTool = null;
            document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('selected'));

            gridContainer.innerHTML = '';
            const roomsSet = new Set();
            
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            roomsSet.add(`${startX},${startY}`);
            
            let added = 1;
            while (added < 3) {
                const roomsArray = Array.from(roomsSet);
                const randomRoom = roomsArray[getRandomInt(0, roomsArray.length - 1)];
                const [cx, cy] = randomRoom.split(',').map(Number);
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                const [dx, dy] = dirs[getRandomInt(0, 3)];
                const nx = cx + dx;
                const ny = cy + dy;
                const key = `${nx},${ny}`;
                
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 1) {
                    roomsSet.add(key);
                    added++;
                }
            }

            const extraRooms = getRandomInt(1, 6);
            let attempts = 0;
            let extraAdded = 0;

            while (extraAdded < extraRooms && attempts < 500) {
                attempts++;
                const roomsArray = Array.from(roomsSet);
                const randomRoom = roomsArray[getRandomInt(0, roomsArray.length - 1)];
                const [cx, cy] = randomRoom.split(',').map(Number);
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                const [dx, dy] = dirs[getRandomInt(0, 3)];
                const nx = cx + dx;
                const ny = cy + dy;
                const key = `${nx},${ny}`;
                
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 2) {
                    roomsSet.add(key);
                    extraAdded++;
                }
            }

            // Отрисовка
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (roomsSet.has(`${x},${y}`)) {
                        cell.classList.add('room');
                    }
                    
                    gridContainer.appendChild(cell);
                }
            }

            gridContainer.classList.add('active');
            toolPanel.style.display = 'flex'; // Показываем панель с флажками
            infoText.textContent = `Сгенерировано комнат: ${roomsSet.size}. Выберите флажок ниже, а затем кликните на комнату.`;
        }

        // ==== ЛОГИКА ВЫБОРА И РАЗМЕЩЕНИЯ ФЛАЖКОВ ====

        // Выбор инструмента в панели
        document.querySelectorAll('.tool-item').forEach(item => {
            item.addEventListener('click', () => {
                const tool = item.dataset.tool;
                
                // Если нажали на тот же инструмент, отменяем выбор
                if (activeTool === tool) {
                    activeTool = null;
                    item.classList.remove('selected');
                } else {
                    // Снимаем выделение со всех и выделяем текущий
                    document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    activeTool = tool;
                }
            });
        });

        // Обработка клика по сетке (делегирование событий)
        gridContainer.addEventListener('click', (e) => {
            // Ищем ближайшую ячейку, по которой кликнули
            const cell = e.target.closest('.cell');
            if (!cell) return;

            // Проверяем, что это комната (а не пустота)
            if (!cell.classList.contains('room')) return;

            // Если не выбран инструмент, ничего не делаем
            if (!activeTool) return;

            const x = parseInt(cell.dataset.x);
            const y = parseInt(cell.dataset.y);

            // Размещаем старт
            if (activeTool === 'start') {
                startPos = { x, y };
            } 
            // Размещаем финиш
            else if (activeTool === 'finish') {
                finishPos = { x, y };
            }

            // Сбрасываем выбор инструмента после установки
            activeTool = null;
            document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('selected'));

            // Перерисовываем иконки на сетке
            updateIcons();
        });

        // Функция обновления иконок на сетке
        function updateIcons() {
            // Сначала очищаем все иконки со всех клеток
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
            });

            // Ставим старт
            if (startPos) {
                const startCell = document.querySelector(`.cell[data-x="${startPos.x}"][data-y="${startPos.y}"]`);
                if (startCell) startCell.textContent = '🚩';
            }

            // Ставим финиш
            if (finishPos) {
                const finishCell = document.querySelector(`.cell[data-x="${finishPos.x}"][data-y="${finishPos.y}"]`);
                if (finishCell) finishCell.textContent = '🏁';
            }
        }

        generateBtn.addEventListener('click', generateDungeon);
    </script>
</body>
</html>
