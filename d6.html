<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon-blue.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первый уровень — Генератор этажа</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            background-color: #0f1722; 
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c9d6e8;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 20px;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #7ab5f5;
            text-decoration: underline;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        /* Контейнер для генератора */
        .generator-container {
            background-color: rgba(27, 40, 56, 0.8);
            border: 1px solid #333;
            border-left: 5px solid #2c5a8c;
            padding: 25px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px; 
        }

        /* Кнопка */
        .btn-generate {
            background-color: #4a90e2;
            color: #0f1722;
            border: none;
            padding: 12px 25px;
            font-size: 1.2em;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-generate:hover {
            background-color: #7ab5f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* Сетка 15x15 */
        .grid-container {
            display: none; 
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 4px; 
            background-color: #0a0f16;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .grid-container.active {
            display: grid;
        }

        /* Ячейка */
        .cell {
            width: 30px;
            height: 30px;
            background-color: #333; 
            border-radius: 4px;
            transition: all 0.2s;
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px; 
            user-select: none; 
        }

        /* Комната */
        .cell.room {
            background-color: #5a636e; 
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Легенда */
        .legend {
            display: none;
            margin-top: 20px;
            width: 100%;
            background-color: rgba(15, 23, 34, 0.6);
            border: 1px solid #2c5a8c;
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 0.95em;
        }
        .legend.active {
            display: block;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }
        .legend-item:last-child {
            margin-bottom: 0;
        }
        .legend-icon {
            font-size: 1.4em;
            width: 30px;
            text-align: center;
        }

        /* Подсказки */
        .info-text {
            margin-top: 15px;
            font-size: 0.9em;
            color: #8c9eb5;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <h1>🎲 Первый уровень</h1>
    <a href="kadgar.html" class="nav-link">← Назад в Инструменты Кадгара</a>

    <div class="generator-container">
        <button class="btn-generate" id="generate-btn">Создать этаж</button>
        
        <!-- Сетка -->
        <div class="grid-container" id="grid"></div>
        
        <!-- Легенда -->
        <div class="legend" id="legend">
            <div class="legend-item"><span class="legend-icon">🚩</span> <span>Старт</span></div>
            <div class="legend-item"><span class="legend-icon">💀</span> <span>Босс (финиш)</span></div>
            <div class="legend-item"><span class="legend-icon">⚠️</span> <span>Ловушки и награда</span></div>
            <div class="legend-item"><span class="legend-icon">🧩</span> <span>Головоломка и награда</span></div>
        </div>

        <div class="info-text" id="info"></div>
    </div>

    <script>
        // ==== НАСТРОЙКИ ГЕНЕРАЦИИ ====
        const GRID_SIZE = 15;
        
        const gridContainer = document.getElementById('grid');
        const generateBtn = document.getElementById('generate-btn');
        const infoText = document.getElementById('info');
        const legend = document.getElementById('legend');

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function isValid(x, y) {
            return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE;
        }

        function countNeighbors(x, y, roomsSet) {
            let count = 0;
            const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            for (let [dx, dy] of dirs) {
                if (roomsSet.has(`${x + dx},${y + dy}`)) {
                    count++;
                }
            }
            return count;
        }

        // ==== ГЕНЕРАЦИЯ ====
        function generateDungeon() {
            gridContainer.innerHTML = '';
            const roomsSet = new Set();
            
            // 1. Старт в центре
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            roomsSet.add(`${startX},${startY}`);
            
            // 2. База (3 соединенные комнаты)
            let added = 1;
            while (added < 3) {
                const roomsArray = Array.from(roomsSet);
                const randomRoom = roomsArray[getRandomInt(0, roomsArray.length - 1)];
                const [cx, cy] = randomRoom.split(',').map(Number);
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                const [dx, dy] = dirs[getRandomInt(0, 3)];
                const nx = cx + dx;
                const ny = cy + dy;
                const key = `${nx},${ny}`;
                
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 1) {
                    roomsSet.add(key);
                    added++;
                }
            }

            // 3. Случайные дополнительные комнаты
            const extraRooms = getRandomInt(1, 6);
            let attempts = 0;
            let extraAdded = 0;

            while (extraAdded < extraRooms && attempts < 500) {
                attempts++;
                const roomsArray = Array.from(roomsSet);
                const randomRoom = roomsArray[getRandomInt(0, roomsArray.length - 1)];
                const [cx, cy] = randomRoom.split(',').map(Number);
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                const [dx, dy] = dirs[getRandomInt(0, 3)];
                const nx = cx + dx;
                const ny = cy + dy;
                const key = `${nx},${ny}`;
                
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 2) {
                    roomsSet.add(key);
                    extraAdded++;
                }
            }

            // 4. Поиск самой далекой комнаты (BFS)
            const queue = [{ x: startX, y: startY, dist: 0 }];
            const visited = new Set();
            visited.add(`${startX},${startY}`);
            
            let farthestRoom = { x: startX, y: startY };
            let maxDistance = -1;

            while (queue.length > 0) {
                const current = queue.shift();
                if (current.dist > maxDistance) {
                    maxDistance = current.dist;
                    farthestRoom = { x: current.x, y: current.y };
                }

                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                for (let [dx, dy] of dirs) {
                    const nx = current.x + dx;
                    const ny = current.y + dy;
                    const key = `${nx},${ny}`;
                    
                    if (roomsSet.has(key) && !visited.has(key)) {
                        visited.add(key);
                        queue.push({ x: nx, y: ny, dist: current.dist + 1 });
                    }
                }
            }

            // 5. Выбор случайной комнаты для события
            // Собираем все комнаты, кроме старта и босса
            const availableRooms = [];
            roomsSet.forEach(key => {
                const [x, y] = key.split(',').map(Number);
                const isStart = (x === startX && y === startY);
                const isBoss = (x === farthestRoom.x && y === farthestRoom.y);
                if (!isStart && !isBoss) {
                    availableRooms.push({ x, y });
                }
            });

            // Если есть свободные комнаты, выбираем одну
            let eventRoom = null;
            let eventIcon = '';
            if (availableRooms.length > 0) {
                eventRoom = availableRooms[getRandomInt(0, availableRooms.length - 1)];
                // 50/50 шанс на ловушку или головоломку
                eventIcon = Math.random() < 0.5 ? '⚠️' : '🧩';
            }

            // 6. Отрисовка
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (roomsSet.has(`${x},${y}`)) {
                        cell.classList.add('room');
                        
                        if (x === startX && y === startY) {
                            cell.textContent = '🚩';
                        }
                        else if (x === farthestRoom.x && y === farthestRoom.y) {
                            cell.textContent = '💀'; // Заменили финиш на череп
                        }
                        else if (eventRoom && x === eventRoom.x && y === eventRoom.y) {
                            cell.textContent = eventIcon;
                        }
                    }
                    
                    gridContainer.appendChild(cell);
                }
            }

            gridContainer.classList.add('active');
            legend.classList.add('active');
            infoText.textContent = `Этаж готов! Комнат: ${roomsSet.size}. До босса ${maxDistance} шагов.`;
        }

        generateBtn.addEventListener('click', generateDungeon);
    </script>
</body>
</html>
