<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon-blue.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первый уровень — Генератор этажа</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap');

        body {
            font-family: Georgia, serif;
            background-color: #0f1722; 
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: #c9d6e8;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 0;
            margin-bottom: 20px;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #7ab5f5;
            text-decoration: underline;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        /* Контейнеры */
        .generator-container, .special-room-container, .mutator-container, .theme-container {
            background-color: rgba(27, 40, 56, 0.8);
            border: 1px solid #333;
            border-left: 5px solid #2c5a8c;
            padding: 25px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px; 
            margin-bottom: 30px;
        }

        /* Убрали красную/фиолетовую/зеленую полоску, теперь все карточки синие */
        .special-room-container, .mutator-container, .theme-container {
            border-left: 5px solid #2c5a8c;
        }

        .special-room-container h2, .mutator-container h2, .theme-container h2 {
            font-family: 'Cinzel', serif;
            color: #e8b84b;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-generate {
            background-color: #4a90e2;
            color: #0f1722;
            border: none;
            padding: 12px 25px;
            font-size: 1.2em;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            align-self: center; /* Центрируем кнопку */
        }

        .btn-generate:hover {
            background-color: #7ab5f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.4);
        }
        
        .btn-generate:active {
            transform: translateY(0);
        }

        /* Обертка для сетки и счетчика */
        .dungeon-wrapper {
            display: none;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }
        .dungeon-wrapper.active { display: flex; }

        @media (max-width: 800px) {
            .dungeon-wrapper.active { flex-direction: column; align-items: center; }
        }

        /* Сетка */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 4px; 
            background-color: #0a0f16;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: #333; 
            border-radius: 4px;
            transition: all 0.2s;
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px; 
            user-select: none; 
        }

        .cell.room {
            background-color: #5a636e; 
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Счетчик */
        .counter-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(15, 23, 34, 0.9);
            border: 1px solid #2c5a8c;
            border-radius: 8px;
            padding: 20px 15px;
            min-width: 120px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .counter-title {
            font-family: 'Cinzel', serif;
            color: #4a90e2;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .counter-display {
            font-size: 3em;
            font-weight: bold;
            color: #c9d6e8;
            text-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }
        .counter-buttons { display: flex; gap: 15px; }
        .btn-counter {
            background-color: #2c5a8c;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-counter:hover { background-color: #4a90e2; }
        .btn-counter:active { transform: scale(0.95); }

        /* Легенда */
        .legend {
            display: none;
            margin-top: 25px;
            width: 100%;
            background-color: rgba(15, 23, 34, 0.6);
            border: 1px solid #2c5a8c;
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 0.95em;
        }
        .legend.active { display: block; }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-icon { font-size: 1.4em; width: 30px; text-align: center; }

        /* Подсказки */
        .info-text {
            margin-top: 15px;
            font-size: 0.9em;
            color: #8c9eb5;
            text-align: center;
            min-height: 20px;
        }

        /* Контейнеры для результатов (история) */
        .results-history {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .result-card {
            background-color: rgba(15, 23, 34, 0.9);
            border: 1px solid #2c5a8c; /* Синяя обводка для всех карточек */
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }

        .result-card.fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }

        .result-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            color: #e8b84b; /* Золотой заголовок для всех */
        }

        .result-detail {
            font-size: 1.1em;
            color: #c9d6e8;
            margin-bottom: 5px;
        }
        .result-detail span { 
            font-weight: bold; 
            color: #7ab5f5; /* Синий акцент на деталях */
        }

        /* Специфичные стили для тем (крупный текст) */
        .theme-card {
            text-align: center;
        }
        .theme-card .result-title {
            border: none;
            font-size: 2em;
            margin-bottom: 0;
            color: #67e8b6; /* Оставим зеленый цвет текста для темы */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(20px); }
        }
    </style>
</head>
<body>
    <h1>🎲 Первый уровень</h1>
    <a href="kadgar.html" class="nav-link">← Назад в Инструменты Кадгара</a>

    <!-- ГЕНЕРАТОР ЭТАЖА -->
    <div class="generator-container">
        <button class="btn-generate" id="generate-btn">Создать этаж</button>
        
        <div class="dungeon-wrapper" id="dungeon-wrapper">
            <div class="grid-container" id="grid"></div>
            
            <div class="counter-panel">
                <div class="counter-title">Счётчик этажей</div>
                <div class="counter-display" id="floor-count">1</div>
                <div class="counter-buttons">
                    <button class="btn-counter" id="btn-minus">-</button>
                    <button class="btn-counter" id="btn-plus">+</button>
                </div>
            </div>
        </div>
        
        <div class="legend" id="legend">
            <div class="legend-item"><span class="legend-icon">🚩</span> <span>Старт</span></div>
            <div class="legend-item"><span class="legend-icon">💀</span> <span>Босс (финиш)</span></div>
            <div class="legend-item"><span class="legend-icon">⚠️</span> <span>Ловушки и награда</span></div>
            <div class="legend-item"><span class="legend-icon">🧩</span> <span>Головоломка и награда</span></div>
            <div class="legend-item"><span class="legend-icon">❓</span> <span>Особая клетка</span></div>
        </div>

        <div class="info-text" id="info"></div>
    </div>

    <!-- ГЕНЕРАТОР ОСОБЫХ КОМНАТ -->
    <div class="special-room-container">
        <h2>🎲 Генератор особых комнат</h2>
        <button class="btn-generate" id="generate-special-btn">Создать комнату</button>
        <div class="results-history" id="special-history"></div>
    </div>

    <!-- ГЕНЕРАТОР МУТАТОРОВ -->
    <div class="mutator-container">
        <h2>☣️ Мутаторы подземелья</h2>
        <button class="btn-generate" id="generate-mutator-btn">Создать мутатор</button>
        <div class="results-history" id="mutator-history"></div>
    </div>

    <!-- ГЕНЕРАТОР ТЕМ -->
    <div class="theme-container">
        <h2>🎨 Генератор тем</h2>
        <button class="btn-generate" id="generate-theme-btn">Создать тему</button>
        <div class="results-history" id="theme-history"></div>
    </div>

    <script>
        // ==========================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ==========================================
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Универсальная функция для добавления карточки в историю (максимум 3)
        function addToHistory(containerId, htmlContent, isTheme = false) {
            const container = document.getElementById(containerId);
            
            // Создаем новую карточку
            const newCard = document.createElement('div');
            newCard.className = isTheme ? 'result-card theme-card' : 'result-card';
            newCard.innerHTML = htmlContent;

            // Добавляем в начало
            container.prepend(newCard);

            // Если карточек больше 3, удаляем самую нижнюю
            if (container.children.length > 3) {
                const oldCard = container.lastElementChild;
                oldCard.classList.add('fade-out');
                // Ждем окончания анимации и удаляем
                setTimeout(() => {
                    if (oldCard.parentNode === container) {
                        container.removeChild(oldCard);
                    }
                }, 300); 
            }
        }

        // ==========================================
        // ГЕНЕРАТОР ЭТАЖА
        // ==========================================
        const GRID_SIZE = 15;
        const gridContainer = document.getElementById('grid');
        const generateBtn = document.getElementById('generate-btn');
        const infoText = document.getElementById('info');
        const legend = document.getElementById('legend');
        const dungeonWrapper = document.getElementById('dungeon-wrapper');
        const floorCountDisplay = document.getElementById('floor-count');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        
        let currentFloor = 1;

        btnPlus.addEventListener('click', () => { currentFloor++; floorCountDisplay.textContent = currentFloor; });
        btnMinus.addEventListener('click', () => { if (currentFloor > 1) { currentFloor--; floorCountDisplay.textContent = currentFloor; } });

        function isValid(x, y) { return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE; }
        function countNeighbors(x, y, roomsSet) {
            let count = 0;
            for (let [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
                if (roomsSet.has(`${x + dx},${y + dy}`)) count++;
            }
            return count;
        }

        function generateDungeon() {
            gridContainer.innerHTML = '';
            const roomsSet = new Set();
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            roomsSet.add(`${startX},${startY}`);
            
            let added = 1;
            while (added < 3) {
                const roomsArray = Array.from(roomsSet);
                const randomRoom = getRandomItem(roomsArray);
                const [cx, cy] = randomRoom.split(',').map(Number);
                const [dx, dy] = getRandomItem([[0, -1], [0, 1], [-1, 0], [1, 0]]);
                const nx = cx + dx; const ny = cy + dy; const key = `${nx},${ny}`;
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 1) {
                    roomsSet.add(key); added++;
                }
            }

            const extraRooms = getRandomInt(1, 6);
            let attempts = 0; let extraAdded = 0;
            while (extraAdded < extraRooms && attempts < 500) {
                attempts++;
                const randomRoom = getRandomItem(Array.from(roomsSet));
                const [cx, cy] = randomRoom.split(',').map(Number);
                const [dx, dy] = getRandomItem([[0, -1], [0, 1], [-1, 0], [1, 0]]);
                const nx = cx + dx; const ny = cy + dy; const key = `${nx},${ny}`;
                if (isValid(nx, ny) && !roomsSet.has(key) && countNeighbors(nx, ny, roomsSet) <= 2) {
                    roomsSet.add(key); extraAdded++;
                }
            }

            const queue = [{ x: startX, y: startY, dist: 0 }];
            const visited = new Set([`${startX},${startY}`]);
            let farthestRoom = { x: startX, y: startY };
            let maxDistance = -1;

            while (queue.length > 0) {
                const current = queue.shift();
                if (current.dist > maxDistance) { maxDistance = current.dist; farthestRoom = { x: current.x, y: current.y }; }
                for (let [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
                    const nx = current.x + dx; const ny = current.y + dy; const key = `${nx},${ny}`;
                    if (roomsSet.has(key) && !visited.has(key)) {
                        visited.add(key); queue.push({ x: nx, y: ny, dist: current.dist + 1 });
                    }
                }
            }

            const availableRooms = [];
            roomsSet.forEach(key => {
                const [x, y] = key.split(',').map(Number);
                if (!(x === startX && y === startY) && !(x === farthestRoom.x && y === farthestRoom.y)) {
                    availableRooms.push({ x, y });
                }
            });

            let eventRoom = null; let eventIcon = '';
            if (availableRooms.length > 0) {
                const randomIndex = getRandomInt(0, availableRooms.length - 1);
                eventRoom = availableRooms[randomIndex];
                eventIcon = Math.random() < 0.5 ? '⚠️' : '🧩';
                availableRooms.splice(randomIndex, 1);
            }

            let specialRoom = null;
            if (availableRooms.length >= 3) specialRoom = getRandomItem(availableRooms);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (roomsSet.has(`${x},${y}`)) {
                        cell.classList.add('room');
                        if (x === startX && y === startY) cell.textContent = '🚩';
                        else if (x === farthestRoom.x && y === farthestRoom.y) cell.textContent = '💀'; 
                        else if (eventRoom && x === eventRoom.x && y === eventRoom.y) cell.textContent = eventIcon;
                        else if (specialRoom && x === specialRoom.x && y === specialRoom.y) cell.textContent = '❓';
                    }
                    gridContainer.appendChild(cell);
                }
            }

            dungeonWrapper.classList.add('active');
            legend.classList.add('active');
            infoText.textContent = `Этаж готов! Комнат: ${roomsSet.size}. До босса ${maxDistance} шагов.`;
        }
        generateBtn.addEventListener('click', generateDungeon);


        // ==========================================
        // ГЕНЕРАТОР ОСОБЫХ КОМНАТ
        // ==========================================
        const specialBtn = document.getElementById('generate-special-btn');

        function generateSpecialRoom() {
            const roomTypes = ["Торговец", "Квестодатель", "Сокровищница", "Комната Удачи", "Жертвенная комната", "Комната испытаний"];
            const roomType = getRandomItem(roomTypes);
            let contentHtml = '';

            switch(roomType) {
                case "Торговец":
                    contentHtml = `<div class="result-detail">Ассортимент: <span>${getRandomItem(["Оружия и посохи", "Доспехи и щиты", "Свитки и расходники", "Мощные артефакты", "Обменник безделушек"])}</span></div>`;
                    break;
                case "Квестодатель":
                    contentHtml = `<div class="result-detail">Тип задания: <span>${getRandomItem(["Убийство", "Сбор", "Доставка", "Сопровождение"])}</span></div>`;
                    break;
                case "Сокровищница":
                    contentHtml = `<div class="result-detail">Содержимое: <span>${getRandomItem(["Ближнее оружие", "Дальнее оружие", "Магическое", "Доспех", "Артефакт"])}</span></div>`;
                    break;
                case "Комната Удачи":
                    contentHtml = `<div class="result-detail">Эффект: <span>${getRandomItem(["Оружие получает преимущество на первые две атаки", "Увеличена скорость перемещения на 10 фт", "В конце каждого хода лечит на к4+БМ", "С шансом в 33% можно не потратить ячейку заклинания", "Ваш урон увеличен на ваш БМ", "Даёт эффект везунчика на один раз", "Оружие получает помеху на первые две атаки", "Уменьшена скорость перемещения на 10 фт", "В конце каждого хода наносит урон на к4+БМ", "С шансом в 33% можно потратить лишнюю ячейку заклинаний", "Ваш урон уменьшен на ваш БМ", "Даёт эффект везунчика против вас на один раз"])}</span></div>`;
                    break;
                case "Жертвенная комната":
                    contentHtml = `
                        <div class="result-detail">Требование: <span>${getRandomItem(["Пожертвовать одной костью максимального здоровья на этаж (66% шанс на награду)", "Пожертвовать возможностью делать короткий отдых (100% шанс на награду, одноразово)", "Пожертвовать рационом (15% шанс на награду)", "Пожертвовать предметом (доспех/оружие/артефакт) (33% шанс на награду)", "Пожертвовать ячейку заклинаний на этаж (66% шанс на награду)", "Пожертвовать 5 фт максимальной скорости на этаж (66% шанс на награду)"])}</span></div>
                        <div class="result-detail" style="margin-top: 10px;">Награда: <span>${getRandomItem(["Развеивает эффект 1 мутатора", "Дарует какой-либо магический артефакт", "Дарует какой-либо доспех", "Дарует какое-либо оружие", "Дарует какой-либо из баффов от фонтана до конца этажа", "Дарует знание какие типы комнат находятся рядом", "Даёт эффект длительного отдыха", "Даёт эффект какого-либо дебафа от фонтана до конца этажа"])}</span></div>
                    `;
                    break;
                case "Комната испытаний":
                    contentHtml = `<div class="result-detail">Испытание: <span>${getRandomItem(["Пройти комнату без использование рывков", "Пройти комнату без бонусных действий", "Пройти комнату без бонусных умений", "Пройти комнату без реакций", "Пройти комнату не получив урона", "Пройти комнату не используя заклинаний", "Пройти комнату не больше чем за 4 раунда", "Пройти комнату не используя вообще ничего"])}</span></div>`;
                    break;
            }

            const html = `<div class="result-title">${roomType}</div>${contentHtml}`;
            addToHistory('special-history', html, false);
        }
        specialBtn.addEventListener('click', generateSpecialRoom);


        // ==========================================
        // ГЕНЕРАТОР МУТАТОРОВ
        // ==========================================
        const mutatorBtn = document.getElementById('generate-mutator-btn');

        const mutatorsData = [
            "В подземелье очень темно (нужны источники освещения, иногда есть магическая тьма в комнатах)",
            "Невероятно холодно (штраф к скорости и накапливающееся истощение если не обогреваться или не употреблять рационы в пищу каждые несколько комнат)",
            "Всё затоплено (хорошая проводимость электричества, уменьшена скорость передвижения)",
            "Духота, жидкость быстро испаряется (невозможно восстановить здоровье зельями, тк они испаряются как только игрок или монстр их открывает)",
            "Повышенная освещённость (невозможность делать короткий отдых и скрываться из-за магической освещённости)",
            "Местность дикой магии (любое сотворение магии вызывает эффект дикой магии)",
            "Немагическая среда (магия перестаёт работать, частично или везде)",
            "Металл становится тяжелее (всё металлическое становится тяжелее нормы, оружие имеющее металл в себе бьёт с помехой)",
