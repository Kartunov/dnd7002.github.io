<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашний бестиарий — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1, h2, h3 { color: #c9a227; border-bottom: 2px solid #c9a227; padding-bottom: 10px; }
        a { color: #e8b84b; }
        
        .controls {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #c9a227;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #c9a227;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #e8b84b; }
        .btn-danger { background-color: #a83232; color: white; }
        .btn-danger:hover { background-color: #d64545; }
        
        input[type="text"] {
            background-color: #1a1a1a;
            color: #e8e0d0;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
            flex-grow: 1;
            max-width: 300px;
        }

        /* Стили для папок */
        .folder {
            background-color: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c9a227;
            overflow: hidden;
        }
        .folder-header {
            padding: 15px 20px;
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .folder-header h3 { margin: 0; border: none; padding: 0; }
        
        /* Контент папки */
        .folder-content {
            padding: 20px;
            display: none; 
        }
        .folder-content.open { display: block; }

        /* Сетка для монстров */
        .monsters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        @media (max-width: 600px) {
            .monsters-grid { grid-template-columns: 1fr; }
        }

        /* Карточка монстра */
        .monster-card {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            font-size: 0.9em;
            position: relative;
        }
        .monster-card h4 { color: #e8b84b; margin: 0 0 10px 0; font-size: 1.2em; border-bottom: 1px solid #444; padding-bottom: 5px; padding-right: 120px; }
        .monster-card p { margin: 5px 0; }
        
        /* Кнопка удаления монстра */
        .monster-card .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #a83232;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8em;
            z-index: 100;
            transition: all 0.3s ease;
        }
        .monster-card .delete-btn:hover { background-color: #d64545; }
        
        /* Состояние подтверждения удаления */
        .monster-card .delete-btn.confirm-state {
            background-color: #d64545;
            font-weight: bold;
            padding: 6px 15px;
        }
    </style>
</head>
<body>
    <h1>🗂️ Домашний бестиарий</h1>
    <p><a href="index.html">← Назад на главную</a> | <a href="monster.html">+ Создать нового монстра</a></p>

    <div class="controls">
        <input type="text" id="new-folder-name" placeholder="Название новой папки...">
        <button class="btn" id="create-folder-btn">Создать папку</button>
    </div>

    <div id="folders-container">
        <!-- Сюда будут выводиться папки -->
    </div>

    <script>
        // ==== ЛОГИКА ====

        const foldersContainer = document.getElementById('folders-container');
        const newFolderInput = document.getElementById('new-folder-name');
        const createFolderBtn = document.getElementById('create-folder-btn');

        // Глобальные переменные для отслеживания двойного клика
        let pendingDeletion = null; // { folderName, monsterId, button }

        function render() {
            let db = { folders: [] };
            try {
                db = JSON.parse(localStorage.getItem('dnd_monsters_db')) || { folders: [] };
            } catch(e) { console.error(e); }

            foldersContainer.innerHTML = ''; 
            pendingDeletion = null; // Сбрасываем при перерисовке

            if (db.folders.length === 0) {
                foldersContainer.innerHTML = '<p style="color: #888; font-style: italic;">У вас пока нет сохраненных папок.</p>';
                return;
            }

            db.folders.forEach((folder) => {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                
                const folderName = folder.name || 'Без названия';
                const monsters = folder.monsters || [];

                // Заголовок папки
                const header = document.createElement('div');
                header.className = 'folder-header';
                header.innerHTML = `<h3>📁 ${folderName} <span style="font-size:0.8em; color:#888;">(${monsters.length} шт.)</span></h3>`;
                
                // Кнопка удаления папки
                const delFolderBtn = document.createElement('button');
                delFolderBtn.className = 'btn btn-danger';
                delFolderBtn.textContent = 'Удалить папку';
                delFolderBtn.onclick = (e) => {
                    e.stopPropagation();
                    // Меняем текст кнопки для подтверждения
                    if (delFolderBtn.textContent === 'Удалить папку') {
                        delFolderBtn.textContent = 'Точно?';
                        delFolderBtn.style.backgroundColor = '#d64545';
                        
                        // Таймер на отмену через 3 секунды
                        setTimeout(() => {
                            if (delFolderBtn.textContent === 'Точно?') {
                                delFolderBtn.textContent = 'Удалить папку';
                                delFolderBtn.style.backgroundColor = '';
                            }
                        }, 3000);
                    } else {
                        // Удаляем папку
                        let db = JSON.parse(localStorage.getItem('dnd_monsters_db')) || { folders: [] };
                        db.folders = db.folders.filter(f => f.name !== folderName);
                        localStorage.setItem('dnd_monsters_db', JSON.stringify(db));
                        render();
                    }
                };
                header.appendChild(delFolderBtn);

                // Контент папки
                const content = document.createElement('div');
                content.className = 'folder-content';
                
                // Клик по заголовку (открыть/закрыть)
                header.onclick = (e) => { 
                    // Если кликнули не по кнопкам, то переключаем
                    if(e.target.tagName !== 'BUTTON') {
                        content.classList.toggle('open'); 
                    }
                };

                if (monsters.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'monsters-grid';

                    monsters.forEach((monster) => {
                        const card = document.createElement('div');
                        card.className = 'monster-card';
                        
                        const monsterName = monster.name || 'Без имени';
                        const monsterId = monster.id || '';

                        // Кнопка удаления монстра
                        const delMonsterBtn = document.createElement('button');
                        delMonsterBtn.className = 'delete-btn';
                        delMonsterBtn.textContent = '✖ Удалить';
                        delMonsterBtn.title = 'Удалить монстра';
                        
                        // Логика двойного клика
                        delMonsterBtn.onclick = (e) => {
                            e.stopPropagation();
                            e.preventDefault();

                            // Если это тот же монстр, что мы уже хотим удалить
                            if (pendingDeletion && pendingDeletion.monsterId === monsterId) {
                                // Удаляем
                                let db = JSON.parse(localStorage.getItem('dnd_monsters_db')) || { folders: [] };
                                let folder = db.folders.find(f => f.name === folderName);
                                
                                if (folder && folder.monsters) {
                                    folder.monsters = folder.monsters.filter(m => m.id !== monsterId);
                                    localStorage.setItem('dnd_monsters_db', JSON.stringify(db));
                                    render();
                                }
                            } else {
                                // Сбрасываем предыдущее состояние
                                if (pendingDeletion) {
                                    pendingDeletion.button.textContent = '✖ Удалить';
                                    pendingDeletion.button.classList.remove('confirm-state');
                                }

                                // Устанавливаем новое
                                pendingDeletion = {
                                    monsterId: monsterId,
                                    button: delMonsterBtn
                                };

                                delMonsterBtn.textContent = 'Точно?';
                                delMonsterBtn.classList.add('confirm-state');

                                // Таймер отмены через 3 секунды
                                setTimeout(() => {
                                    if (pendingDeletion && pendingDeletion.monsterId === monsterId) {
                                        delMonsterBtn.textContent = '✖ Удалить';
                                        delMonsterBtn.classList.remove('confirm-state');
                                        pendingDeletion = null;
                                    }
                                }, 3000);
                            }
                        };
                        
                        card.appendChild(delMonsterBtn);

                        // Вывод данных
                        const hp = (monster.hpMin && monster.hpMax) ? `${monster.hpMin}-${monster.hpMax}` : (monster.hpMin || monster.hpMax || '—');
                        
                        card.innerHTML += `
                            <h4>${monsterName}</h4>
                            <p><b>Тип:</b> ${monster.type || '—'} | <b>Размер:</b> ${monster.size || '—'} | <b>Роль:</b> ${monster.role || '—'}</p>
                            <p><b>КД:</b> ${monster.ac || '—'} | <b>ХП:</b> ${hp} | <b>Скорость:</b> ${monster.speed || '—'}</p>
                        `;

                        grid.appendChild(card);
                    });
                    content.appendChild(grid);
                } else {
                    content.innerHTML = '<p style="color: #888;">В этой папке пока нет монстров.</p>';
                }

                folderDiv.appendChild(header);
                folderDiv.appendChild(content);
                foldersContainer.appendChild(folderDiv);
            });
        }

        createFolderBtn.onclick = () => {
            const name = newFolderInput.value.trim();
            if (!name) { alert("Введите название папки!"); return; }
            
            let db = JSON.parse(localStorage.getItem('dnd_monsters_db')) || { folders: [] };
            if (db.folders.find(f => f.name.toLowerCase() === name.toLowerCase())) {
                alert("Папка с таким названием уже существует!"); return;
            }
            db.folders.push({ name: name, monsters: [] });
            localStorage.setItem('dnd_monsters_db', JSON.stringify(db));
            
            newFolderInput.value = '';
            render();
        };

        render();
    </script>
</body>
</html>
