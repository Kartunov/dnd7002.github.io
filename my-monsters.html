<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашний бестиарий — D&D</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #1a1a1a;
            color: #e8e0d0;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        h1, h2, h3 { color: #c9a227; border-bottom: 2px solid #c9a227; padding-bottom: 10px; }
        a { color: #e8b84b; }
        
        .controls {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #c9a227;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #c9a227;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #e8b84b; }
        .btn-danger { background-color: #a83232; color: white; }
        .btn-danger:hover { background-color: #d64545; }
        
        input[type="text"] {
            background-color: #1a1a1a;
            color: #e8e0d0;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
            flex-grow: 1;
            max-width: 300px;
        }

        /* Стили для папок */
        .folder {
            background-color: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c9a227;
            overflow: hidden;
        }
        .folder-header {
            padding: 15px 20px;
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .folder-header h3 { margin: 0; border: none; padding: 0; }
        .folder-content {
            padding: 20px;
            display: none; /* Скрыто по умолчанию */
        }
        .folder-content.open { display: block; }

        /* Сетка для монстров (по 2 в ряд) */
        .monsters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        @media (max-width: 600px) {
            .monsters-grid { grid-template-columns: 1fr; }
        }

        /* Карточка монстра */
        .monster-card {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            font-size: 0.9em;
            position: relative;
        }
        .monster-card h4 { color: #e8b84b; margin: 0 0 10px 0; font-size: 1.2em; border-bottom: 1px solid #444; padding-bottom: 5px; padding-right: 30px; }
        .monster-card p { margin: 5px 0; }
        .monster-card .stat-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px 0; }
        .monster-card .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #a83232;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8em;
            z-index: 10; /* Чтобы кнопка была поверх всего */
        }
        .monster-card .delete-btn:hover { background-color: #d64545; }
    </style>
</head>
<body>
    <h1>🗂️ Домашний бестиарий</h1>
    <p><a href="index.html">← Назад на главную</a> | <a href="monster.html">+ Создать нового монстра</a></p>

    <div class="controls">
        <input type="text" id="new-folder-name" placeholder="Название новой папки...">
        <button class="btn" id="create-folder-btn">Создать папку</button>
    </div>

    <div id="folders-container">
        <!-- Сюда будут выводиться папки -->
    </div>

    <script>
        // ==== ОСНОВНАЯ ЛОГИКА ====
        
        const foldersContainer = document.getElementById('folders-container');
        const newFolderInput = document.getElementById('new-folder-name');
        const createFolderBtn = document.getElementById('create-folder-btn');

        // Безопасное получение базы
        function getDB() {
            try {
                const data = localStorage.getItem('dnd_monsters_db');
                if (!data) return { folders: [] };
                const parsed = JSON.parse(data);
                // Защита: если папок нет, создаем пустой массив
                if (!parsed.folders) parsed.folders = [];
                return parsed;
            } catch (e) {
                console.error("Ошибка чтения базы:", e);
                return { folders: [] };
            }
        }

        function saveDB(db) {
            try {
                localStorage.setItem('dnd_monsters_db', JSON.stringify(db));
            } catch (e) {
                console.error("Ошибка сохранения базы:", e);
                alert("Не удалось сохранить данные. Возможно, переполнена память браузера.");
            }
        }

        function getModifier(val) {
            if (!val) return null;
            const num = parseInt(val, 10);
            if (isNaN(num)) return null;
            return Math.floor((num - 10) / 2);
        }

        // Безопасное превращение массива в строку
        function safeJoin(arr) {
            return Array.isArray(arr) ? arr.join(', ') : '';
        }

        function render() {
            const db = getDB();
            foldersContainer.innerHTML = ''; 

            if (db.folders.length === 0) {
                foldersContainer.innerHTML = '<p style="color: #888; font-style: italic;">У вас пока нет сохраненных папок.</p>';
                return;
            }

            db.folders.forEach((folder) => {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';

                const header = document.createElement('div');
                header.className = 'folder-header';
                // Защита от пустого имени папки
                const folderName = folder.name || "Без названия";
                header.innerHTML = `<h3>📁 ${folderName} <span style="font-size:0.8em; color:#888;">(${folder.monsters ? folder.monsters.length : 0} шт.)</span></h3>`;
                
                const delFolderBtn = document.createElement('button');
                delFolderBtn.className = 'btn btn-danger';
                delFolderBtn.textContent = 'Удалить папку';
                delFolderBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    if (confirm(`Вы уверены, что хотите удалить папку "${folderName}" и всех монстров в ней?`)) {
                        let currentDb = getDB();
                        // Удаляем папку по имени (так надежнее, чем по индексу)
                        currentDb.folders = currentDb.folders.filter(f => f.name !== folder.name);
                        saveDB(currentDb);
                        render();
                    }
                };
                header.appendChild(delFolderBtn);

                const content = document.createElement('div');
                content.className = 'folder-content';
                
                header.onclick = () => {
                    content.classList.toggle('open');
                };

                const monsters = folder.monsters || [];

                if (monsters.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'monsters-grid';

                    monsters.forEach((monster) => {
                        const card = document.createElement('div');
                        card.className = 'monster-card';

                        const delMonsterBtn = document.createElement('button');
                        delMonsterBtn.className = 'delete-btn';
                        delMonsterBtn.textContent = '✖';
                        delMonsterBtn.title = 'Удалить монстра';
                        
                        delMonsterBtn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            if (confirm(`Точно удалить монстра "${monster.name || 'Без имени'}" из этой папки?`)) {
                                let currentDb = getDB();
                                let currentFolder = currentDb.folders.find(f => f.name === folder.name);
                                
                                if (currentFolder && currentFolder.monsters) {
                                    // Фильтруем по ID, а если ID нет — по имени и индексу
                                    currentFolder.monsters = currentFolder.monsters.filter(m => {
                                        if (m.id && monster.id) return m.id !== monster.id;
                                        return m !== monster; // Резервный вариант
                                    });
                                    saveDB(currentDb);
                                    render();
                                }
                            }
                        };
                        card.appendChild(delMonsterBtn);

                        // Защита данных при выводе
                        const name = monster.name || 'Без имени';
                        const type = monster.type || '—';
                        const size = monster.size || '—';
                        const role = monster.role || '—';
                        const ac = monster.ac || '—';
                        const speed = monster.speed || '—';
                        const hp = (monster.hpMin && monster.hpMax) ? `${monster.hpMin}-${monster.hpMax}` : (monster.hpMin || monster.hpMax || '—');
                        
                        const stats = monster.stats || {};
                        const statsHtml = ['str', 'dex', 'con', 'int', 'wis', 'cha'].map(stat => {
                            const val = stats[stat];
                            if (!val) return `<span>—</span>`;
                            const mod = getModifier(val);
                            const modStr = mod !== null ? (mod >= 0 ? `+${mod}` : `${mod}`) : '';
                            return `<span><b>${stat.toUpperCase()}:</b> ${val} ${modStr ? `(${modStr})` : ''}</span>`;
                        }).join('<br>');

                        card.innerHTML += `
                            <h4>${name}</h4>
                            <p><b>Тип:</b> ${type} | <b>Размер:</b> ${size} | <b>Роль:</b> ${role}</p>
                            <p><b>КД:</b> ${ac} | <b>ХП:</b> ${hp} | <b>Скорость:</b> ${speed}</p>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 10px 0; font-size: 0.9em;">
                                ${statsHtml}
                            </div>
                            ${monster.saves && monster.saves.length ? `<p><b>Спасброски:</b> ${safeJoin(monster.saves)}</p>` : ''}
                            ${monster.vulns && monster.vulns.length ? `<p><b>Уязвимости:</b> ${safeJoin(monster.vulns)}</p>` : ''}
                            ${monster.ress && monster.ress.length ? `<p><b>Сопротивления:</b> ${safeJoin(monster.ress)}</p>` : ''}
                            ${monster.imms && monster.imms.length ? `<p><b>Иммунитет:</b> ${safeJoin(monster.imms)}</p>` : ''}
                            ${monster.traits ? `<p><b>Особенности:</b><br><span style="white-space: pre-wrap;">${monster.traits}</span></p>` : ''}
                            ${monster.actions ? `<p><b>Действия:</b><br><span style="white-space: pre-wrap;">${monster.actions}</span></p>` : ''}
                            ${monster.description ? `<p><b>Описание:</b><br><span style="white-space: pre-wrap;">${monster.description}</span></p>` : ''}
                        `;

                        grid.appendChild(card);
                    });
                    content.appendChild(grid);
                } else {
                    content.innerHTML = '<p style="color: #888;">В этой папке пока нет монстров.</p>';
                }

                folderDiv.appendChild(header);
                folderDiv.appendChild(content);
                foldersContainer.appendChild(folderDiv);
            });
        }

        createFolderBtn.onclick = () => {
            const name = newFolderInput.value.trim();
            if (!name) {
                alert("Введите название папки!");
                return;
            }
            const db = getDB();
            if (db.folders.find(f => f.name.toLowerCase() === name.toLowerCase())) {
                alert("Папка с таким названием уже существует!");
                return;
            }
            db.folders.push({ name: name, monsters: [] });
            saveDB(db);
            newFolderInput.value = '';
            render();
        };

        render();
    </script>
</body>
</html>
